<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" role="img" aria-label="Animated cream white plush teddy bear with floppy ears and a sky blue scarf">
<defs>
 <radialGradient id="cream" cx="28%" cy="18%" r="85%"><stop stop-color="#fff9e9"/><stop offset=".42" stop-color="#e9d8bc"/><stop offset=".82" stop-color="#c5a987"/><stop offset="1" stop-color="#98795e"/></radialGradient>
 <radialGradient id="inner" cx="35%" cy="25%"><stop stop-color="#f9e7d5"/><stop offset="1" stop-color="#c99c82"/></radialGradient>
 <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7f2ff"/><stop offset=".45" stop-color="#79bde8"/><stop offset="1" stop-color="#347db6"/></linearGradient>
 <radialGradient id="nose" cx="25%" cy="20%"><stop stop-color="#89675b"/><stop offset="1" stop-color="#39251f"/></radialGradient>
 <filter id="drop" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="12"/></filter>
 <pattern id="stitch" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M2 3q4 3 2 8M10 1q-2 5 2 9" stroke="#fff" stroke-opacity=".25" stroke-width="1.4" fill="none" stroke-linecap="round"/></pattern>
</defs>
<ellipse cx="300" cy="600" rx="160" ry="22" fill="#6c9ec2" opacity=".22" filter="url(#drop)"/>
<g>
 <animateTransform attributeName="transform" type="translate" values="0 0;0 -13;0 0" dur="3.8s" repeatCount="indefinite"/>
 <!-- legs -->
 <ellipse cx="213" cy="535" rx="88" ry="73" fill="url(#cream)"/><ellipse cx="387" cy="535" rx="88" ry="73" fill="url(#cream)"/>
 <!-- body -->
 <ellipse cx="300" cy="432" rx="150" ry="178" fill="url(#cream)"/>
 <ellipse cx="300" cy="432" rx="150" ry="178" fill="url(#stitch)" opacity=".6"/>
 <ellipse cx="300" cy="465" rx="82" ry="110" fill="#f4e8d5" opacity=".65"/>
 <!-- floppy ears -->
 <ellipse cx="145" cy="185" rx="60" ry="91" transform="rotate(-35 145 185)" fill="url(#cream)"/>
 <ellipse cx="455" cy="185" rx="60" ry="91" transform="rotate(35 455 185)" fill="url(#cream)"/>
 <ellipse cx="145" cy="188" rx="29" ry="57" transform="rotate(-35 145 188)" fill="url(#inner)"/>
 <ellipse cx="455" cy="188" rx="29" ry="57" transform="rotate(35 455 188)" fill="url(#inner)"/>
 <!-- head -->
 <circle cx="300" cy="245" r="158" fill="url(#cream)"/>
 <circle cx="300" cy="245" r="158" fill="url(#stitch)" opacity=".55"/>
 <!-- little hair tuft -->
 <path d="M270 92q-15-38 12-49q-4 28 20 39q19-34 38-21q-17 15-8 34" fill="#f8eddb" stroke="#d7c2a5" stroke-width="5" stroke-linecap="round"/>
 <!-- eyes -->
 <ellipse cx="241" cy="242" rx="16" ry="22" fill="#33241e"/><ellipse cx="359" cy="242" rx="16" ry="22" fill="#33241e"/>
 <circle cx="236" cy="234" r="5" fill="#fff"/><circle cx="354" cy="234" r="5" fill="#fff"/>
 <!-- cheeks and muzzle -->
 <ellipse cx="204" cy="292" rx="29" ry="17" fill="#e99d9a" opacity=".38"/><ellipse cx="396" cy="292" rx="29" ry="17" fill="#e99d9a" opacity=".38"/>
 <ellipse cx="300" cy="305" rx="66" ry="51" fill="#f7e8d6"/>
 <ellipse cx="300" cy="286" rx="21" ry="15" fill="url(#nose)"/>
 <path d="M300 301v16q-15 16-29 0M300 317q15 16 29 0" fill="none" stroke="#8b6554" stroke-width="4.5" stroke-linecap="round"/>
 <!-- scarf around neck -->
 <path d="M188 366q112 62 224 0l-12 65q-98 47-200 0z" fill="url(#scarf)" stroke="#5b9bc9" stroke-width="4"/>
 <path d="M360 411q62 9 72 55q-46 11-85-10z" fill="url(#scarf)" stroke="#5b9bc9" stroke-width="4"/>
 <path d="M205 386q95 48 190 0" fill="none" stroke="#e8f8ff" stroke-width="5" opacity=".8" stroke-linecap="round"/>
 <!-- star held on chest -->
 <path d="M300 443l15 31 34 5-25 24 6 34-30-16-30 16 6-34-25-24 34-5z" fill="#ffe3a0" stroke="#d8b56b" stroke-width="4"/>
 <path d="M300 457v55" stroke="#fff4cf" stroke-width="4" opacity=".7"/>
 <!-- arm curves -->
 <ellipse cx="168" cy="413" rx="49" ry="85" transform="rotate(26 168 413)" fill="url(#cream)"/>
 <ellipse cx="432" cy="413" rx="49" ry="85" transform="rotate(-26 432 413)" fill="url(#cream)"/>
</g>
<circle cx="500" cy="125" r="13" fill="#f4cf78"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle>
<path d="M500 93v-15M500 172v-15M468 125h-15M547 125h-15" stroke="#e9c56e" stroke-width="5" stroke-linecap="round"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></path>
</svg>
